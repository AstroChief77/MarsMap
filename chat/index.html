<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroChief | Mars Görev İletişim &amp; Dosya Aktarımı</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23d92b2b%22/></svg>">
  <link rel="stylesheet" href="../css/fonts.css?v=4.6">
  <link rel="stylesheet" href="../css/chat.css?v=4.6">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  </style>
</head>
<body class="standalone-chat-body">
  <div class="chat-shell">
    <header class="chat-header">
      <div class="chat-title-wrap">
        <span class="status-dot"></span>
        <h1 class="chat-title">AstroChief | Mars Görev İletişim</h1>
      </div>
      <div class="crew-bar">
        <label for="crew-select">Mürettebat:</label>
        <select id="crew-select" class="crew-select"></select>
      </div>
    </header>

    <main id="messages-area" class="messages-area">
      <div class="empty-state">Mesajlar yükleniyor...</div>
    </main>

    <div id="attach-bar" class="attach-bar hidden">
      <span id="attach-name"></span>
      <button type="button" id="remove-file-btn" class="remove-file-btn">✕</button>
    </div>

    <footer class="chat-footer">
      <form id="chat-form" class="chat-form">
        <input type="file" id="file-input" style="display:none;" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.log,.json,.geojson,.csv,.zip">
        <button type="button" id="attach-btn" class="attach-btn" title="Dosya Ekle (Maks 15 MB)">📎</button>
        <input type="text" id="msg-input" class="msg-input" placeholder="Görev mesajınızı yazın..." maxlength="2000" autocomplete="off">
        <button type="submit" id="send-btn" class="send-btn">Gönder</button>
      </form>
      <div class="security-note">🔒 HTTPS Korumalı • XSS/SQLi Engelli • Beyaz Listeli Güvenli Dosya Aktarımı (Maks 15 MB)</div>
    </footer>
  </div>

  <script>
    class StandaloneMissionChat {
      constructor() {
        this.apiCandidates = ["../api/chat.php", "./api/chat.php"];
        this.apiEndpoint = "../api/chat.php";
        this.lastMessageId = 0;
        this.isFetching = false;
        this.seenMessageIds = new Set();
        this.selectedFile = null;
        this.crewMembers = [
          { name: "Atahan", role: "Kaptan & Diktatör" },
          { name: "Akif", role: "Lead Developer" },
          { name: "Rıfat", role: "Coder" },
          { name: "Ömer", role: "Coder" },
          { name: "Mustafa", role: "Coder" },
          { name: "Buse", role: "Başkan Yardımcısı" },
          { name: "Astronot", role: "Misafir Mürettebat" }
        ];

        const saved = localStorage.getItem("astrochief_chat_user") || "Atahan";
        const found = this.crewMembers.find(m => m.name === saved) || this.crewMembers[0];
        this.currentUser = found.name;
        this.currentRole = found.role;

        this.crewSelect = document.getElementById("crew-select");
        this.messagesArea = document.getElementById("messages-area");
        this.attachBar = document.getElementById("attach-bar");
        this.attachName = document.getElementById("attach-name");
        this.removeFileBtn = document.getElementById("remove-file-btn");
        this.fileInput = document.getElementById("file-input");
        this.attachBtn = document.getElementById("attach-btn");
        this.msgInput = document.getElementById("msg-input");
        this.sendBtn = document.getElementById("send-btn");
        this.chatForm = document.getElementById("chat-form");

        this.init();
      }

      init() {
        this.crewMembers.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.name;
          opt.textContent = `${m.name} (${m.role})`;
          if (m.name === this.currentUser) opt.selected = true;
          this.crewSelect.appendChild(opt);
        });

        this.crewSelect.addEventListener("change", (e) => {
          this.currentUser = e.target.value;
          const found = this.crewMembers.find(m => m.name === this.currentUser);
          this.currentRole = found ? found.role : "Mürettebat";
          localStorage.setItem("astrochief_chat_user", this.currentUser);
        });

        this.attachBtn.addEventListener("click", () => this.fileInput.click());
        this.fileInput.addEventListener("change", (e) => {
          if (e.target.files && e.target.files[0]) {
            this.selectedFile = e.target.files[0];
            this.attachName.textContent = `📎 ${this.selectedFile.name} (${this.formatBytes(this.selectedFile.size)})`;
            this.attachBar.classList.remove("hidden");
          }
        });

        this.removeFileBtn.addEventListener("click", () => {
          this.selectedFile = null;
          this.fileInput.value = "";
          this.attachBar.classList.add("hidden");
        });

        this.chatForm.addEventListener("submit", (e) => this.sendMessage(e));

        this.fetchMessages();
        setInterval(() => this.fetchMessages(), 3000);
      }

      async requestApi(queryOrInit) {
        for (const candidate of this.apiCandidates) {
          try {
            const res = typeof queryOrInit === "string"
              ? await fetch(`${candidate}${queryOrInit}`)
              : await fetch(candidate, queryOrInit);
            if (res.ok || res.status === 400 || res.status === 429) {
              this.apiEndpoint = candidate;
              return res;
            }
          } catch (e) {}
        }
        return null;
      }

      resolveSafeFileUrl(rawUrl) {
        const clean = String(rawUrl || "").trim().replace(/^(\.\/|\.\.\/)+/, "");
        if (!/^uploads\/[a-f0-9]{32}\.[a-z0-9]+$/i.test(clean)) return "";
        const prefix = this.apiEndpoint.startsWith("../") ? "../" : "./";
        return `${prefix}${clean}`;
      }

      async fetchMessages() {
        if (this.isFetching) return;
        this.isFetching = true;
        try {
          const res = await this.requestApi(`?action=get_messages&since_id=${this.lastMessageId}`);
          if (!res || !res.ok) {
            if (this.lastMessageId === 0) {
              const empty = this.messagesArea.querySelector(".empty-state");
              if (empty) empty.textContent = "Mesaj servisine bağlanılamadı (PHP API çevrimdışı veya erişilemiyor).";
            }
            return;
          }
          const data = await res.json();
          if (data.success && Array.isArray(data.messages)) {
            const empty = this.messagesArea.querySelector(".empty-state");
            if (empty) empty.remove();
            if (data.messages.length === 0 && this.lastMessageId === 0 && this.seenMessageIds.size === 0) {
              const div = document.createElement("div");
              div.className = "empty-state";
              div.textContent = "Henüz mesaj yok. İlk mesajı gönderin!";
              this.messagesArea.appendChild(div);
              return;
            }
            let appended = 0;
            data.messages.forEach(msg => {
              const msgId = Number(msg.id) || 0;
              if (msgId > 0 && this.seenMessageIds.has(msgId)) return;
              if (msgId > 0) this.seenMessageIds.add(msgId);
              this.renderMessage(msg);
              if (msgId > this.lastMessageId) this.lastMessageId = msgId;
              appended++;
            });
            if (appended > 0) {
              this.messagesArea.scrollTop = this.messagesArea.scrollHeight;
            }
          }
        } catch (err) {
          if (this.lastMessageId === 0) {
            const empty = this.messagesArea.querySelector(".empty-state");
            if (empty) empty.textContent = "Mesajlar alınırken bağlantı hatası oluştu.";
          }
        } finally {
          this.isFetching = false;
        }
      }

      async sendMessage(e) {
        e.preventDefault();
        const text = this.msgInput.value.trim();
        if (!text && !this.selectedFile) return;

        this.sendBtn.disabled = true;
        this.sendBtn.textContent = "Gönderiliyor...";

        try {
          const fd = new FormData();
          fd.append("action", "send_message");
          fd.append("user_name", this.currentUser);
          fd.append("role", this.currentRole);
          fd.append("message", text);
          if (this.selectedFile) fd.append("file", this.selectedFile);

          const res = await this.requestApi({ method: "POST", body: fd });
          if (!res) throw new Error("API unreachable");
          const data = await res.json();
          if (data.success) {
            this.msgInput.value = "";
            this.selectedFile = null;
            this.fileInput.value = "";
            this.attachBar.classList.add("hidden");
            await this.fetchMessages();
          } else {
            alert(data.error || "Gönderilemedi");
          }
        } catch (err) {
          alert("Sunucu bağlantı hatası.");
        } finally {
          this.sendBtn.disabled = false;
          this.sendBtn.textContent = "Gönder";
          this.msgInput.focus();
        }
      }

      renderMessage(msg) {
        const card = document.createElement("div");
        card.className = "msg-card" + (msg.user_name === this.currentUser ? " own" : "");

        const meta = document.createElement("div");
        meta.className = "msg-meta";

        const authorWrap = document.createElement("div");
        authorWrap.className = "msg-author-wrap";
        const author = document.createElement("span");
        author.className = "msg-author";
        author.textContent = msg.user_name;
        const role = document.createElement("span");
        role.className = "msg-role";
        role.textContent = msg.role;
        authorWrap.appendChild(author);
        authorWrap.appendChild(role);

        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = msg.created_at ? msg.created_at.slice(11, 16) : "";

        meta.appendChild(authorWrap);
        meta.appendChild(time);
        card.appendChild(meta);

        if (msg.message) {
          const body = document.createElement("div");
          body.className = "msg-text";
          body.textContent = msg.message;
          card.appendChild(body);
        }

        const safeFileUrl = this.resolveSafeFileUrl(msg.file_url);
        if (safeFileUrl) {
          const ext = (msg.file_type || "").toLowerCase();
          const isImg = ["jpg", "jpeg", "png", "gif", "webp"].includes(ext);

          if (isImg) {
            const img = document.createElement("img");
            img.className = "file-preview-img";
            img.src = safeFileUrl;
            img.alt = msg.file_name || "Görsel";
            img.addEventListener("click", () => window.open(safeFileUrl, "_blank", "noopener,noreferrer"));
            card.appendChild(img);
          }

          const link = document.createElement("a");
          link.className = "file-card";
          link.href = safeFileUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.download = msg.file_name || "dosya";

          const icon = document.createElement("span");
          icon.textContent = isImg ? "🖼️" : (ext === "zip" ? "📦" : (ext === "pdf" ? "📄" : "📁"));
          const info = document.createElement("div");
          const name = document.createElement("div");
          name.className = "file-name";
          name.textContent = msg.file_name || "Dosya İndir";
          const size = document.createElement("div");
          size.className = "file-size";
          size.textContent = this.formatBytes(msg.file_size || 0);

          info.appendChild(name);
          info.appendChild(size);
          link.appendChild(icon);
          link.appendChild(info);
          card.appendChild(link);
        }

        this.messagesArea.appendChild(card);
      }

      formatBytes(bytes) {
        if (!bytes) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }
    }

    document.addEventListener("DOMContentLoaded", () => new StandaloneMissionChat());
  </script>
</body>
</html>
