name: Auto-Deploy Web to mars.kubitron.com

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "version.json"
      - "SOURCES.md"
      - "BACKEND_API.md"
      - "api/**"
      - "chat/**"
      - "css/**"
      - "js/**"
      - "data/**"
      - "res/**"
      - ".github/workflows/deploy-mars-web.yml"
  workflow_dispatch:

concurrency:
  group: mars-web-deploy-prod
  cancel-in-progress: false

jobs:
  validate-web:
    name: Validate Web Bundle & Readme Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & PHP for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enforce <800 line rule and verify ES modules & JSON
        shell: bash
        run: |
          set -euo pipefail
          over=$(find api chat css js -type f \( -name "*.js" -o -name "*.css" -o -name "*.php" -o -name "*.html" \) -exec awk 'END{ if (NR >= 800) print FILENAME ":" NR }' {} \;)
          if [ -n "$over" ]; then
            echo "HATA: 800 satir sinirini asan dosya var:"
            echo "$over"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const path = require("path");
            for (const jf of ["version.json", "data/tiles/manifest.json", "data/datasets/jpl_mars_trek_layers.json"]) {
              JSON.parse(fs.readFileSync(jf, "utf8"));
            }
            const manifest = JSON.parse(fs.readFileSync("data/tiles/manifest.json", "utf8"));
            const cfg = JSON.parse(fs.readFileSync("data/datasets/jpl_mars_trek_layers.json", "utf8"));
            const extMap = Object.fromEntries(cfg.tile_layers.map(l => [l.id, l.format]));
            let missing = 0;
            for (const [lid, keys] of Object.entries(manifest.tiles)) {
              for (const k of keys) {
                const p = path.join("data/tiles", lid, `${k}.${extMap[lid]}`);
                if (!fs.existsSync(p)) { console.error("Missing tile:", p); missing++; }
              }
            }
            if (missing > 0) process.exit(1);
            console.log("[OK] JSON, JS modul ve", Object.values(manifest.tiles).flat().length, "karo dogrulandi.");
          '

  deploy-mars-web:
    name: Sync Web Changes to mars.kubitron.com
    needs: validate-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment credentials configuration
        id: cfg
        shell: bash
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ]; then
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ] && [ -n "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ]; then
            echo "mode=webhook" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unconfigured" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy web files via SSH + rsync (preserves storage & uploads)
        if: steps.cfg.outputs.mode == 'ssh'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'mars.kubitron.com' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/mars' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            --filter='P storage/***' \
            --filter='P uploads/***' \
            --filter='P .well-known/***' \
            --filter='P .deployed_web_sha' \
            --include='index.html' \
            --include='version.json' \
            --include='SOURCES.md' \
            --include='BACKEND_API.md' \
            --include='api/***' \
            --include='chat/***' \
            --include='css/***' \
            --include='js/***' \
            --include='data/***' \
            --include='res/***' \
            --exclude='storage/***' \
            --exclude='uploads/***' \
            --exclude='.well-known/***' \
            --exclude='.deployed_web_sha' \
            --exclude='*' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$DEPLOY_PATH" "${{ github.sha }}" <<'EOF'
            set -e
            TARGET="${1:-/var/www/mars}"
            SHA="${2:-}"
            [ -d "$TARGET/storage" ] || mkdir -p "$TARGET/storage"
            [ -d "$TARGET/uploads" ] || mkdir -p "$TARGET/uploads"
            chown -R www-data:www-data "$TARGET/storage" "$TARGET/uploads" || true
            chmod 770 "$TARGET/storage" || true
            chmod 775 "$TARGET/uploads" || true
            [ -n "$SHA" ] && echo "$SHA" > "$TARGET/.deployed_web_sha"
            if command -v nginx >/dev/null 2>&1; then
              nginx -t && systemctl reload nginx || true
            fi
          EOF

      - name: Trigger mars.kubitron.com webhook fallback
        if: steps.cfg.outputs.mode == 'webhook'
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"ref":"refs/heads/main","after":"${{ github.sha }}","source":"github-actions"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY"

      - name: Print setup instructions when GitHub secrets are not yet configured
        if: steps.cfg.outputs.mode == 'unconfigured'
        shell: bash
        run: |
          echo "::notice::DEPLOY_SSH_KEY / DEPLOY_WEBHOOK_URL secretleri henuz tanimlanmadi. Sunucu tarafinda systemd pull (install_autodeploy.sh) kullaniliyorsa mars.kubitron.com 30sn icinde otomatik guncellenir; push bazli hizli dagitim icin Repo Settings -> Secrets bolumune DEPLOY_USER ve DEPLOY_SSH_KEY ekleyin."

      - name: Live health check on mars.kubitron.com
        if: steps.cfg.outputs.mode != 'unconfigured'
        shell: bash
        run: |
          sleep 2
          curl -fsS -I https://mars.kubitron.com/ | head -n 5
          curl -fsS https://mars.kubitron.com/version.json

# ==============================================================================
# DOSYA SATIR VE ISLEV ACIKLAMALARI (Satir Satir Ne Ise Yaradigi):
# ------------------------------------------------------------------------------
# - Satir 1-22: Web dosyalari (index.html, css, js, api, chat, data) main'e pushlandiginda tetiklenen CI/CD tanimi.
# - Satir 24-61: validate-web; <800 satir kurali, JSON semalari ve data/tiles/manifest.json dosya butunlugunu dogrular.
# - Satir 63-146: deploy-mars-web; SSH+rsync (storage/uploads haric) veya HTTPS HMAC Webhook uzerinden mars.kubitron.com'a senkronize eder.
# ==============================================================================
