<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AstroChief Mars Navigator - NASA Space Apps 2026 | 2D/3D Gezinebilen Mars Haritası, Asit Yağmuru & Fırtına Kaçınmalı Güvenli Rota Planlayıcı">
  <title>AstroChief | Mars Navigator v3.3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23d92b2b%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%23ffffff%22 opacity=%220.2%22/></svg>">
  <link rel="stylesheet" href="./css/style.css?v=3.7">
</head>
<body>

  <!-- Zifiri Siyah Uzay ve Parıldayan Yıldızlar Tuvali -->
  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <!-- Orta Alan: Ana Mars Harita ve Rota Sahnesi -->
  <main id="mars-navigator-app" class="app-viewport">
    <canvas id="mars-map-canvas" aria-label="Etkileşimli Mars Haritası"></canvas>

    <!-- Sol Üst: Ayarlar (1. Seçenek Factory Reset), Hızlı Hedef Şeridi ve 9 Dil Seçici -->
    <div id="top-left-dock" class="hud-top-left"></div>

    <!-- Sağ Üst: Mavi / Soluk Mavi Rota, Süre/Saat, Mesafe/km ve α/β/γ Radyasyon Paneli -->
    <div id="top-right-dock" class="hud-top-right"></div>

    <!-- Sol Alt: Uydular Paneli (2D/3D, Asit Yağmuru & Şiddeti, Fırtına & Şiddeti) -->
    <div id="bottom-left-dock" class="hud-bottom-left"></div>

    <!-- Sağ Alt: Zoom Kontrolleri, Koordinat ve Canlı FPS Göstergesi -->
    <div id="bottom-right-dock" class="hud-bottom-right"></div>

    <!-- Bildirim / FPS Koruma Uyarı Bandı -->
    <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

    <!-- Görev, NASA Kaynakları ve Ekip Bilgi Modalı -->
    <div id="mission-modal-root"></div>
  </main>

  <!-- Çift tıklamayla (file://) ve HTTP sunucuda sorunsuz açılan sıralı yerel modül betikleri -->
  <script defer src="./data/offlineDatasets.js?v=3.7"></script>
  <script defer src="./data/craterLocations.js?v=3.7"></script>
  <script defer src="./data/craterWaypointsData.js?v=3.7"></script>
  <script defer src="./data/resourcesData.js?v=3.7"></script>
  <script defer src="./data/teamData.js?v=3.7"></script>
  <script defer src="./data/i18n/localesTrEnDe.js?v=3.7"></script>
  <script defer src="./data/i18n/localesFrEs.js?v=3.7"></script>
  <script defer src="./data/i18n/localesJaKoArHe.js?v=3.7"></script>

  <script defer src="./js/models/AppConfig.js?v=3.7"></script>
  <script defer src="./js/models/ResourceItem.js?v=3.7"></script>
  <script defer src="./js/models/TeamMember.js?v=3.7"></script>

  <script defer src="./js/services/I18nService.js?v=3.7"></script>
  <script defer src="./js/services/StateStorageService.js?v=3.7"></script>
  <script defer src="./js/services/FpsGuardService.js?v=3.7"></script>
  <script defer src="./js/services/DatasetLoader.js?v=3.7"></script>
  <script defer src="./js/services/MarsTileLoader.js?v=3.7"></script>
  <script defer src="./js/services/MarsTopographyService.js?v=3.7"></script>
  <script defer src="./js/services/HazardFieldService.js?v=3.7"></script>
  <script defer src="./js/services/BackendApiService.js?v=3.7"></script>
  <script defer src="./js/services/RouteGeometryHelper.js?v=3.7"></script>
  <script defer src="./js/services/RoutePlannerService.js?v=3.7"></script>

  <script defer src="./js/renderers/StarfieldRenderer.js?v=3.7"></script>
  <script defer src="./js/renderers/OverlayDrawHelper.js?v=3.7"></script>
  <script defer src="./js/renderers/RouteCanvasRenderer.js?v=3.7"></script>
  <script defer src="./js/renderers/Map2DRenderer.js?v=3.7"></script>
  <script defer src="./js/renderers/Map3DRenderer.js?v=3.7"></script>

  <script defer src="./js/components/SettingsPanel.js?v=3.7"></script>
  <script defer src="./js/components/SatellitesPanel.js?v=3.7"></script>
  <script defer src="./js/components/RouteInspectorPanel.js?v=3.7"></script>
  <script defer src="./js/components/MissionInfoModal.js?v=3.7"></script>
  <script defer src="./js/components/MarsNavigatorController.js?v=3.7"></script>
  <script defer src="./js/app.js?v=3.7"></script>
</body>
</html>
