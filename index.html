<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AstroChief - NASA Space Apps Challenge 2026 'Interplanetary Survival Guide: Martian Map' astronot krater keşif haritası ve Marswalk navigasyon aracı.">
  <title>AstroChief | Mars Crater Map &amp; Astronaut Navigator</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
  
  <!-- CSS Stilleri (Public Sans Web Bold & Temiz Siyah Uzay Teması) -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Zifiri Siyah Uzay & Parıldayan Gerçekçi Yıldızlar Tuvali -->
  <canvas id="starfield-canvas"></canvas>

  <!-- Uygulama İçerik Katmanı -->
  <div id="app-content-wrapper">

    <!-- En Üst Astronot Canlı Telemetri Çubuğu (EVA HUD) -->
    <div id="hud-telemetry-container"></div>

    <!-- Görev Kontrol Gezinti Çubuğu (Navbar Container) -->
    <header id="navbar-container"></header>

    <!-- Ana Çalışma Alanı -->
    <main>
      <!-- Google Earth / NASA Trek Tarzı Etkileşimli Krater Haritası -->
      <section id="crater-viewer-section" class="section-crater-viewer">
        <div id="crater-viewer-container"></div>
      </section>

      <!-- NASA Space Apps 2026 Meydan Okuma Detayları (Details Section) -->
      <div id="details-container"></div>

      <!-- Resmi NASA Kaynakları ve Yasal Uyarı Metni (Resources Section) -->
      <div id="resources-container"></div>

      <!-- AstroChief Uçuş Mürettebatı (Teams Section) -->
      <div id="teams-container"></div>
    </main>

    <!-- Sayfa Alt Bilgisi (Footer Container) -->
    <div id="footer-container"></div>

  </div>

  <!-- ES6 Modüler JavaScript Giriş Noktası -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
