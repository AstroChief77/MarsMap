<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AstroChief Mars Navigator - NASA Space Apps 2026 | 2D/3D Gezinebilen Mars Haritası, Asit Yağmuru & Fırtına Kaçınmalı Güvenli Rota Planlayıcı">
  <title>AstroChief | Mars Navigator v4.4</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23d92b2b%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%23ffffff%22 opacity=%220.2%22/></svg>">
  <link rel="stylesheet" href="./css/style.css?v=4.4">
</head>
<body>

  <!-- Açık Gri Stüdyo Arka Plan ve İnce Yörünge Katmanı Tuvali -->
  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <!-- Orta Alan: Ana Mars Harita ve Rota Sahnesi -->
  <main id="mars-navigator-app" class="app-viewport">
    <canvas id="mars-map-canvas" aria-label="Etkileşimli Mars Haritası"></canvas>

    <!-- Sol Üst: Ayarlar (1. Seçenek Factory Reset), Hızlı Arama Şeridi ve 9 Dil Seçici -->
    <div id="top-left-dock" class="hud-top-left"></div>

    <!-- Sağ Üst: Mavi Güvenli Rota, 5sn Gecikme Rozeti, Süre/Saat, Mesafe/km, O₂ Bütçesi ve α/β/γ Radyasyon Paneli -->
    <div id="top-right-dock" class="hud-top-right"></div>

    <!-- Sol Alt: Uydular Paneli (2D/3D, Asit Yağmuru & Şiddeti, Fırtına & Şiddeti) -->
    <div id="bottom-left-dock" class="hud-bottom-left"></div>

    <!-- Sağ Alt: Zoom Kontrolleri, Koordinat ve Canlı FPS Göstergesi -->
    <div id="bottom-right-dock" class="hud-bottom-right"></div>

    <!-- Bildirim / FPS Koruma Uyarı Bandı -->
    <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

    <!-- Demo Control Bar -->
    <div id="demo-bar-root" class="demo-bar-root"></div>

    <div id="mission-modal-root"></div>
  </main>
